name: DS-6320 fix referral email URL

on:
  push:
    branches:
      - feature/DS-6320-email-referral-semibold
    paths:
      - '.github/workflows/ds6320-email-referral-fix.yml'

permissions:
  contents: write

jobs:
  fix-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/DS-6320-email-referral-semibold
          fetch-depth: 0

      - name: Restore current template and remove stale referral campaign
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- utils/relay-templates/dt/dt-earybirds-template.html
          python3 - <<'PY'
          from pathlib import Path

          path = Path('utils/relay-templates/dt/dt-earybirds-template.html')
          content = path.read_text()
          old = 'https://goemms.com/registrado?utm_source=emms&utm_campaign=email-confirmacion-referidos-emms2026-abr26&dplrid={$encodeEmail}#referidos'
          new = 'https://goemms.com/registrado?dplrid={$encodeEmail}#referidos'
          preheader = 'Desbloquea el Pase VIP y accede a workshops, recursos exclusivos y 6 meses gratis de Doppler.'

          assert content.count(old) == 2, f'expected 2 stale referral URLs, got {content.count(old)}'
          assert preheader in content, 'expected preheader is missing'
          content = content.replace(old, new)
          assert content.count(new) == 2, f'expected 2 cleaned referral URLs, got {content.count(new)}'
          assert old not in content
          assert preheader in content
          path.write_text(content)
          PY
          rm .github/workflows/ds6320-email-referral-fix.yml
          git diff --check

      - name: Commit final fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(DS-6320): keep preheader and clean referral URL"
          git push origin HEAD:feature/DS-6320-email-referral-semibold
