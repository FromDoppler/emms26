name: DS-6325 Prettier Probe

on:
  push:
    branches:
      - feat/DS-6325-unify-phone-input

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format phone module
        run: npx --yes prettier@3.9.6 --write src/1.0.0/js/intell-input/intell-input.js
      - name: Commit formatted module
        run: |
          if git diff --quiet -- src/1.0.0/js/intell-input/intell-input.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/1.0.0/js/intell-input/intell-input.js
          git commit -m "style(DS-6325): apply prettier"
          git push origin HEAD:feat/DS-6325-unify-phone-input
