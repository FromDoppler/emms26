name: EMMS sales report

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: America/Argentina/Buenos_Aires
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish sales report
        env:
          SALES_REPORT_TRIGGER_TOKEN: ${{ secrets.SALES_REPORT_TRIGGER_TOKEN }}
        run: |
          if [ -z "$SALES_REPORT_TRIGGER_TOKEN" ]; then
            echo "Missing SALES_REPORT_TRIGGER_TOKEN secret."
            exit 1
          fi

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Sales-Report-Token: ${SALES_REPORT_TRIGGER_TOKEN}" \
            --header 'Accept: application/json' \
            https://goemms.com/services/publish-sales-report.php)"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Sales report endpoint returned HTTP ${http_code}."
            exit 1
          fi
